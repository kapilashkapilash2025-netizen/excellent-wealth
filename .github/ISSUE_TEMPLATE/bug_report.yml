name: Bug report
description: Report a defect in Excellent Wealth
title: 'fix: '
labels: ['bug']
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version / commit
      placeholder: e.g. v0.1.0 or commit hash
    validations:
      required: false

  - type: checkboxes
    id: security
    attributes:
      label: Confirmation
      options:
        - label: This is not a security vulnerability (those should be reported via SECURITY.md, not a public issue)
          required: true
